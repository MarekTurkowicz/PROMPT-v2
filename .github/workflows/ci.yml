name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DB_NAME: promt_db
  DB_USER: promt_user
  DB_PASSWORD: promt_ci
  LOCAL_DB_HOST: localhost
  LOCAL_DB_PORT: 5432

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pre-commit==4.7.0
      - run: pre-commit run --all-files --show-diff-on-failure

  backend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: mypy backend/
      - run: pipx run --spec pip-audit==2.10.1 pip-audit -r backend/requirements.txt

  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          HUSKY: 0
          CYPRESS_INSTALL_BINARY: 0
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm audit --audit-level=high

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres: &postgres
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: promt_db
          POSTGRES_USER: promt_user
          POSTGRES_PASSWORD: promt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promt_user -d promt_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate
      - run: pytest

  e2e-playwright:
    # Disabled until the PROMT 2.0 frontend exists (M4).
    if: false
    needs: backend-integration
    runs-on: ubuntu-latest
    services:
      postgres: *postgres
    env:
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: admin-ci
      VITE_API_PROXY_TARGET: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Start backend
        working-directory: backend
        run: |
          python manage.py migrate
          python manage.py create_default_super_user
          python manage.py seed
          python manage.py runserver 127.0.0.1:8000 > ../backend.log 2>&1 &
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
        env:
          HUSKY: 0
          CYPRESS_INSTALL_BINARY: 0
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev > ../frontend.log 2>&1 &
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:8000/api/health/
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:5173
      - run: npx playwright test
        working-directory: frontend
      - name: Server logs
        if: failure()
        run: cat backend.log frontend.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
