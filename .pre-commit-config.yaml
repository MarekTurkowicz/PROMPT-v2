repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^backend/
        exclude: /migrations/
      - id: ruff-format
        files: ^backend/
        exclude: /migrations/

  - repo: local
    hooks:
      - id: no-skipped-backend-tests
        name: no skipped backend tests
        language: pygrep
        entry: '\bpytest\.(mark\.)?skip(if)?\b|\bunittest\.skip|@skip(If|Unless)?\b'
        files: ^backend/.*tests?.*\.py$
      - id: no-skipped-frontend-tests
        name: no skipped frontend tests
        language: pygrep
        entry: '\b(it|test|describe)\.(skip|fixme)\b|\bx(it|describe)\('
        files: ^frontend/.*\.(spec|test)\.[jt]sx?$
