networks:
  my-network:
    driver: bridge

services:
  db:
    image: postgres:18.3-alpine
    container_name: promt_postgres
    restart: on-failure
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      - my-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object-relational variant (#52), started with: docker compose --profile object_relational up
  ordb:
    image: postgres:18.3-alpine
    container_name: prompt_ordb
    restart: on-failure
    profiles:
      - object_relational
    environment:
      POSTGRES_DB: ${OR_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGPORT: ${OR_DB_PORT:-27016}
    volumes:
      - ordb_data:/var/lib/postgresql
    ports:
      - "${OR_DB_PORT:-27016}:${OR_DB_PORT:-27016}"
    networks:
      - my-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${OR_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate_or:
    command: python manage.py migrate_or
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    container_name: prompt_ordb_migrate
    restart: "no"
    profiles:
      - object_relational
    depends_on:
      ordb:
        condition: service_healthy
    environment:
      OR_DB_NAME: ${OR_DB_NAME}
      OR_DB_USER: ${DB_USER}
      OR_DB_PASSWORD: ${DB_PASSWORD}
      OR_DB_HOST: ordb
      OR_DB_PORT: ${OR_DB_PORT:-27016}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    networks:
      - my-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: promt_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_API_URL: ""
    networks:
      - my-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    command: sh -c "python manage.py migrate && python manage.py create_default_super_user && python manage.py runserver 0.0.0.0:8000"
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    container_name: promt_backend
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    networks:
      - my-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')\""]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s

  playwright:
    build:
      context: ./frontend
      dockerfile: ./playwright.Dockerfile
    container_name: playwright_tests
    profiles:
      - test
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:5173
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
      CI: "true"
    networks:
      - my-network
    volumes:
      - ./frontend/playwright-report:/app/playwright-report
      - ./frontend/test-results:/app/test-results
    command: npx playwright test --reporter=list

volumes:
  postgres_data:
  ordb_data:
