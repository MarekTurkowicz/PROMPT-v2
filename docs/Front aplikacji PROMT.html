<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front aplikacji PROMT</title>
<style>
/* Idea: wierna makieta aplikacji PROMT 2.0: sidebar 240px + header 56px + treść. Paleta slate + indigo, kolory statusów jak w kodzie frontu. Jeden motyw jasny, tak jak w aplikacji. */
:root{
  --ink:#0f172a; --muted:#64748b; --border:#e5e7eb; --bg:#f8fafc; --surface:#ffffff; --danger:#ef4444;
  --accent:#4f46e5;
  --nav-bg:#0e1a3a; --nav-strong:#ffffff; --nav-ink:#e2e8f0; --nav-muted:#a9b6cc; --nav-hover:rgba(255,255,255,.07); --nav-active:rgba(255,255,255,.14); --nav-line:rgba(255,255,255,.12);
  --shadow:0 1px 3px rgba(0,0,0,.06);
  color-scheme: light;
}
/* pochodne akcentu liczone w każdym zakresie, żeby podgląd marki działał */
:root,.bp{
  --blue:var(--accent);
  --accent-hover:color-mix(in srgb,var(--accent) 86%,#000);
  --accent-tint:color-mix(in srgb,var(--accent) 9%,#fff);
  --accent-soft:color-mix(in srgb,var(--accent) 24%,#fff);
  --accent-ink:color-mix(in srgb,var(--accent) 72%,#000);
  --nav-accent:color-mix(in srgb,var(--accent) 55%,#fff);
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:72px}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.muted{color:var(--muted);font-size:.9rem}
.demo{flex:none;display:flex;gap:6px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:6px 16px;background:#0f172a;color:#cbd5e1;font-size:.8rem}
.demo a{color:#fff}
#app{flex:1;display:flex;flex-direction:column;min-height:0}

/* shell */
.layout{flex:1;display:grid;grid-template-columns:252px minmax(0,1fr)}
.sb{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;background:var(--nav-bg);color:var(--nav-ink);display:flex;flex-direction:column;overflow-y:auto}
.sb :focus-visible{outline-color:var(--nav-strong)}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;text-decoration:none;min-width:0}
.sb-logo,.sb-mark{width:34px;height:34px;border-radius:9px;flex:none}
.sb-logo{object-fit:contain;background:rgba(255,255,255,.08)}
.sb-mark{background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.sb-name{font-weight:700;font-size:1.08rem;line-height:1.15;color:var(--nav-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-nav{display:grid;gap:2px;padding:6px 10px}
.nav{position:relative;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--nav-muted);font-size:.95rem;transition:background .15s,color .15s}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--nav-hover);color:var(--nav-strong)}
.nav.on{background:var(--nav-active);color:var(--nav-strong);font-weight:600}
.nav.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--nav-accent)}
.sb-spacer{flex:1}
.sb-bottom{border-top:1px solid var(--nav-line);margin-top:8px;padding-top:8px}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px 12px 14px 16px}
.sb-uname{min-width:0;flex:1;text-align:left;background:none;border:none;padding:2px 0;border-radius:6px}
.sb-uname b{display:block;font-size:.88rem;color:var(--nav-strong);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-uname small{display:block;font-size:.74rem;color:var(--nav-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-out{flex:none;width:36px;height:36px;border-radius:8px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--nav-muted)}
.sb-out:hover{background:var(--nav-hover);color:var(--nav-strong)}
.sb-out svg{width:20px;height:20px}
.col{display:flex;flex-direction:column;min-width:0}
.main{padding:24px;min-width:0}
.hb{position:sticky;top:0;z-index:60;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px;background:#fff;border-bottom:1px solid var(--border)}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem;min-width:0;list-style:none;margin:0;padding:0}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs li+li::before{content:"/";color:#cbd5e1;margin-right:8px}
.crumbs [aria-current]{color:var(--ink);font-weight:600}
.hb-tag{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:32px;height:32px;border-radius:999px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;flex:none}

/* shared */
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card.err{background:#fff1f2;border-color:#fecdd3;color:#be123c}
.centered{text-align:center;padding:22px 0}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:.72rem;font-weight:650;white-space:nowrap}
.chip.gray{background:#e5e7eb;color:#111827}.chip.amber{background:#fde68a;color:#92400e}.chip.green{background:#bbf7d0;color:#065f46}.chip.red{background:#fecaca;color:#7f1d1d}.chip.sky{background:#bae6fd;color:#075985}
.btn,.btn-primary,.btn-danger,.btn-indigo,.btn-dark{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 14px;border-radius:10px;border:1px solid transparent;text-decoration:none;font-size:.95rem;white-space:nowrap;transition:background-color .15s}
.btn{background:transparent;color:#475569}.btn:hover{background:#f1f5f9;color:var(--ink)}
.btn.on{background:#e2e8f0;color:#111827;font-weight:600}
.btn-primary{background:var(--blue);color:#fff;font-weight:600;padding:0 22px}.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:var(--danger);color:#fff;border-radius:8px}.btn-danger:hover{background:#dc2626}
.btn-indigo{background:var(--accent);color:#fff}.btn-indigo:hover{background:var(--accent-hover)}
.btn-dark{background:var(--accent);color:#fff;font-weight:600}.btn-dark:hover{background:var(--accent-hover)}
.btn:disabled,.btn-indigo:disabled{opacity:.6;cursor:not-allowed}
.form-input{border:1px solid #cbd5e1;border-radius:8px;height:40px;padding:0 10px;font-size:.95rem;background:#fff;outline:none;min-width:0}
.form-input:focus{box-shadow:0 0 0 3px var(--accent-tint);border-color:var(--accent)}

/* list pages (projects, tasks, fundings) */
.lp{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
.lp-side{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.lp-side h2{margin:0 0 10px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lp-main{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
.lp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:4px}
.lp-head h1{margin:0;font-size:1.2rem;font-weight:600}
.lp-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:6px 10px;font-size:.85rem;transition:all .15s}
.chip-btn:hover{background:var(--bg)}
.chip-btn.on{background:var(--accent-tint);border-color:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.filters{display:grid;gap:6px}
.filters .btn{justify-content:flex-start;border-color:#e2e8f0;height:36px}
.filters .btn.on{background:var(--accent-tint);border-color:var(--accent-soft);color:var(--accent-ink)}
.in-row{display:grid;gap:4px;margin:2px 0 6px}
.in-row label,.sort label{font-size:.85rem;color:#475569}
.in-row input,.sort select{border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;font-size:.9rem;outline:none;background:#fff;width:100%}
.sort{margin-top:14px;display:grid;gap:6px}
.switch{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:.95rem}
.list{display:grid;gap:10px;margin-top:10px}
.item{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.item h3{margin:0;font-weight:600;font-size:1.05rem}
.desc{margin:.25rem 0 0;color:#475569;font-size:.95rem}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:center}
.meta-t{font-size:.8rem;color:var(--muted)}
.item-act{display:flex;gap:6px;flex-wrap:wrap}
.acc{cursor:pointer}
.acc-body{margin-top:10px;border-top:1px solid #eef2f7;padding-top:10px;display:grid;gap:8px}
.sub-item{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px solid #eef2f7;border-radius:10px;padding:8px 10px;background:#fbfdff}

/* dashboard home */
.dash-hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.dash-title{margin:0;font-size:1.6rem;font-weight:650}
.dash-sub{margin:6px 0 0;color:var(--muted)}
.ucard{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.ucard .av{width:34px;height:34px}
.ucard b{display:block;font-weight:650;line-height:1.1}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wide{grid-column:1/-1}
.dc-h{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}
.dc-h h2{margin:0;font-size:1.05rem;font-weight:650}
.lp-name{font-size:1.05rem;font-weight:700}
.lp-tag{margin-top:4px;color:#475569;font-size:.95rem}
.lp-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.dots{display:inline-flex;gap:6px;align-items:center}
.dots i{width:10px;height:6px;border-radius:999px;border:1px solid #e2e8f0;background:#f1f5f9}
.dots i.on{background:#c7d2fe;border-color:#c7d2fe}
.ai{position:relative;overflow:hidden}
.ai::before{content:"";position:absolute;inset:-40px;background:radial-gradient(circle at top right,rgba(79,70,229,.18),transparent 55%),radial-gradient(circle at bottom left,rgba(14,165,233,.14),transparent 55%);pointer-events:none}
.ai>*{position:relative}
.feat{display:flex;align-items:center;gap:10px;border:1px solid #eef2f7;background:rgba(255,255,255,.7);padding:10px;border-radius:12px;opacity:.8;margin-top:6px;font-size:.92rem;color:#334155}
.feat i{width:8px;height:8px;border-radius:999px;background:#cbd5e1}
.feat span{margin-left:auto}
.ai-foot{display:flex;gap:10px;margin-top:10px}
.ai-try{flex:1;height:36px;border-radius:10px;border:1px solid #e2e8f0;background:var(--bg);color:var(--muted);cursor:not-allowed}
.ai-more{height:36px;border-radius:10px;padding:0 12px;border:none;background:var(--accent);color:#fff}
.qas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.qa{border:1px solid #e2e8f0;border-radius:14px;padding:14px;box-shadow:var(--shadow);background:#fff;text-decoration:none;display:flex;align-items:center;gap:12px;transition:transform .15s,background .15s}
.qa:hover{transform:translateY(-1px);background:var(--bg)}
.qa-i{width:38px;height:38px;border-radius:12px;background:#eef2f7;display:flex;align-items:center;justify-content:center;border:1px solid #e2e8f0;font-weight:700;color:#475569;flex:none}
.qa.pri .qa-i{background:var(--accent-tint);border-color:var(--accent-soft);color:var(--accent-ink)}
.qa b{display:block}
.qa small{color:var(--muted);font-size:.9rem}
.qa-ar{margin-left:auto;font-weight:800;color:#475569}
.work{display:grid;grid-template-columns:minmax(0,2fr) minmax(200px,1fr);gap:12px;align-items:start}
.heat{border:1px solid #eef2f7;border-radius:14px;padding:12px}
.heat-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.heat-g.h{margin-bottom:8px;font-size:.78rem;color:var(--muted);text-align:center;font-weight:650}
.hc{height:16px;border-radius:6px;border:1px solid #e2e8f0;background:#f1f5f9}
.hc.l1,.hd.l1{background:#e0e7ff;border-color:#c7d2fe}.hc.l2,.hd.l2{background:#c7d2fe;border-color:#a5b4fc}.hc.l3,.hd.l3{background:#818cf8;border-color:#6366f1}
.hc.fut{opacity:.4;border-style:dashed}
.heat-l{display:flex;align-items:center;gap:8px;margin-top:10px;justify-content:center;font-size:.85rem;color:var(--muted)}
.hd{width:14px;height:10px;border-radius:6px;border:1px solid #e2e8f0;background:#f1f5f9}
.ins{display:flex;gap:10px;align-items:center;background:#fbfdff;border:1px solid #eef2f7;border-radius:12px;padding:12px;margin-bottom:10px}
.ins small{display:block;font-size:.72rem;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.02em}
.ins b{font-weight:700}

/* project detail */
.pd{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.pd-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pd-t{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pd-t h1{margin:0;font-size:1.25rem;font-weight:600}
.pd-st{border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600;background:#e5e7eb}
.pd-st.new{background:#dbeafe;color:#1e3a8a}.pd-st.active{background:#dcfce7;color:#14532d}.pd-st.closed{background:#fee2e2;color:#991b1b}
.pd-tabs{display:flex;gap:8px;margin-top:10px;border-bottom:1px solid var(--border);overflow-x:auto}
.pd-tab{padding:8px 12px;border-radius:10px 10px 0 0;color:#475569;text-decoration:none;white-space:nowrap}
.pd-tab.on{background:var(--accent-tint);color:var(--accent-ink);font-weight:600}
.pd-c{margin-top:10px;display:grid;gap:12px;min-width:0}

/* project overview */
.pov{display:flex;flex-direction:column;gap:10px}
.pov-hr{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:12px;align-items:start}
.pov-pill{padding:4px 10px;border-radius:999px;font-size:.78rem;line-height:1;font-weight:650;text-transform:uppercase;letter-spacing:.04em;border:1px solid #e2e8f0;background:#eef2f7;display:inline-block}
.pov-pill.new{background:#e0f2fe;color:#0369a1;border-color:#bae6fd}.pov-pill.active{background:#dcfce7;color:#15803d;border-color:#bbf7d0}.pov-pill.closed{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
.pov-title{margin:6px 0 0;font-size:1.25rem;font-weight:650}
.pov-desc{margin:4px 0 0;color:#475569;font-size:.92rem;line-height:1.35}
.pov-desc.col{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.lnk{padding:0;border:none;background:transparent;color:var(--blue);font-size:.86rem;font-weight:650;margin-top:6px}
.lnk:hover{text-decoration:underline}
.pov-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pov-mi{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:12px;background:var(--bg);border:1px solid #eef2f7;min-width:0}
.pov-mi small{color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;font-weight:650;font-size:.68rem}
.pov-mi b{font-weight:650;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mood{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;font-size:.85rem;border:1px solid var(--border);white-space:nowrap}
.mood.healthy{background:linear-gradient(to right,#ecfdf5,#f0f9ff)}.mood.warning{background:linear-gradient(to right,#fffbeb,#fef9c3)}.mood.critical{background:linear-gradient(to right,#fef2f2,#fee2e2)}
.mood b{font-weight:650}.mood span{color:var(--muted);font-size:.8rem;font-weight:650}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.pov-lay{display:flex;gap:12px;align-items:flex-start}
.pov-c{display:flex;flex-direction:column;gap:12px;min-width:0}
.pov-main{flex:1.75}.pov-side{flex:1}
.sec{padding:12px 14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.sec-h h3{margin:0;font-size:1.02rem;font-weight:650}
.sec-h small{font-size:.82rem;color:var(--muted)}
.empty-s{padding:10px 12px;font-size:.9rem;color:#94a3b8;border-radius:12px;background:var(--bg);border:1px dashed #e2e8f0}
.dist{height:18px;border-radius:999px;overflow:hidden;background:#e5e7eb;margin:6px 0 10px;display:flex;gap:2px}
.dist div{display:flex;align-items:center;justify-content:center;font-size:.74rem;font-weight:650;white-space:nowrap;overflow:hidden}
.dist .todo{background:#fee2e2;color:#b91c1c}.dist .doing{background:#e0f2fe;color:#0369a1}.dist .done{background:#dcfce7;color:#166534}
.health{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:12px;padding-top:10px;border-top:1px solid #eef2f7}
.prog{margin-bottom:8px}
.prog-l{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:4px}
.prog-t{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.prog-t i{display:block;height:100%;border-radius:999px}
.hl{font-size:.88rem;margin-bottom:6px}
.tabs-s{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tab-s{border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:5px 12px;font-size:.85rem}
.tab-s.on{background:var(--accent-tint);border-color:var(--accent-soft);color:var(--accent-ink);font-weight:650}
.ch-title{font-weight:650;font-size:.92rem;margin-bottom:4px}
.ch-foot{font-size:.82rem;color:var(--muted);margin-top:6px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.ax{font-size:11px;fill:#64748b}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:#334155;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.dstat{background:var(--bg);border:1px solid #eef2f7;border-radius:12px;padding:8px 10px}
.dstat small{display:block;color:var(--muted);font-size:.75rem}
.dstat b{font-size:1.1rem}
.risk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.risk ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:.88rem}
.risk-n{margin-top:10px;font-size:.84rem;color:#475569;border-top:1px solid #eef2f7;padding-top:8px}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.feed li{border:1px solid #eef2f7;border-radius:10px;padding:8px 10px;background:#fbfdff}
.feed b{font-size:.92rem;font-weight:600}
.feed small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}

/* kanban */
.kan{display:flex;flex-direction:column;gap:14px}
.kan-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
.kan-l{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 10px;border:1px solid #cbd5e1;border-radius:8px;background:var(--bg);font-size:.85rem}
.seg button.on{background:#e2e8f0;color:#111827;font-weight:600}
.kan-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}

function lineChart(pts,s1,s2,label){
 const W=560,H=180,pl=30,pr=10,pt=12,pb=24;
 const mx=Math.max(2,...pts.map(p=>Math.max(p.a,p.b)));
 const step=Math.ceil(mx/4);const yMax=step*Math.ceil(mx/step);
 const x=i=>pl+i*(W-pl-pr)/(pts.length-1),y=v=>pt+(H-pt-pb)*(1-v/yMax);
 let g='';for(let v=0;v<=yMax;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8f0" stroke-width="1"/><text class="ax" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
 const path=k=>pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p[k]).toFixed(1)).join(' ');
 const xl=pts.map((p,i)=>i%2===0||i===pts.length-1?`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${p.label}</text>`:'').join('');
 const cw=(W-pl-pr)/(pts.length-1);
 const hits=pts.map((p,i)=>`<rect x="${x(i)-cw/2}" y="${pt}" width="${cw}" height="${H-pt-pb}" fill="transparent" data-tip="${esc(p.label+'|'+s1.name+': '+p.a+'|'+s2.name+': '+p.b)}"/>`).join('');
 const last=pts.length-1;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}${xl}
 <path d="${path('a')}" fill="none" stroke="${s1.c}" stroke-width="2" stroke-linejoin="round"/>
 <path d="${path('b')}" fill="none" stroke="${s2.c}" stroke-width="2" stroke-linejoin="round"/>
 <circle cx="${x(last)}" cy="${y(pts[last].a)}" r="4" fill="${s1.c}" stroke="#fff" stroke-width="2"/>
 <circle cx="${x(last)}" cy="${y(pts[last].b)}" r="4" fill="${s2.c}" stroke="#fff" stroke-width="2"/>${hits}</svg>
 <div class="legend"><span><i style="background:${s1.c}"></i>${s1.name}</span><span><i style="background:${s2.c}"></i>${s2.name}</span></div>`;
}
function barChart(items,name,label,color){
 const W=560,H=170,pl=30,pr=10,pt=18,pb=24;
 const mx=Math.max(2,...items.map(i=>i.v));const step=Math.ceil(mx/4);const yMax=step*Math.ceil(mx/step);
 const y=v=>pt+(H-pt-pb)*(1-v/yMax);const slot=(W-pl-pr)/items.length,bw=Math.min(44,slot*.6);
 let g='';for(let v=0;v<=yMax;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8f0"/><text class="ax" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
 const bars=items.map((it,i)=>{const cx=pl+slot*i+slot/2,h=(H-pt-pb)*it.v/yMax,top=y(it.v);
  return `<rect x="${slot*i+pl}" y="${pt}" width="${slot}" height="${H-pt-pb}" fill="transparent" data-tip="${esc(it.l+'|'+name+': '+it.v)}"/>`+
  (it.v>0?`<path d="M${cx-bw/2} ${H-pb}V${top+4}a4 4 0 0 1 4-4h${bw-8}a4 4 0 0 1 4 4V${H-pb}Z" fill="${color}" pointer-events="none"/><text class="ax" x="${cx}" y="${top-5}" text-anchor="middle" style="fill:#334155">${it.v}</text>`:'')+
  `<text class="ax" x="${cx}" y="${H-6}" text-anchor="middle">${it.l}</text>`;}).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}${bars}</svg>`;
}

const relLum=h=>{const [r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*r+.7152*g+.0722*b;};

 fundings:{label:'Finansowania',cols:['name','program','funder','amount','type','start_date','end_date'],req:['name'],

  add:r=>{FUNDINGS.unshift({id:++FID,name:r.name,program:r.program||'',funder:r.funder||'',amount:+r.amount||0,type:r.type||'grant',start:r.start_date||off(0),end:r.end_date||null,created:0});}}
};
function parseCSV(t){
 t=t.replace(/^﻿/,'').trim();if(!t)return {head:[],rows:[]};
 const first=t.split(/\r?\n/)[0],d=first.split(';').length>first.split(',').length?';':',';
 const out=[];let row=[],cur='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
  else if(c==='"')q=true;else if(c===d){row.push(cur);cur='';}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';out.push(row);row=[];}else cur+=c;}
 row.push(cur);out.push(row);
 return {head:out[0].map(h=>h.trim().toLowerCase()),rows:out.slice(1).filter(r=>r.some(c=>c.trim()!==''))};
}
function impResult(){
 const I=S.imp,sch=IMP[I.type];if(!I.text.trim())return null;
 const {head,rows}=parseCSV(I.text),missing=sch.req.filter(c=>!head.includes(c)),unknown=head.filter(h=>!sch.cols.includes(h)),ok=[],bad=[];
 if(!missing.length)rows.forEach((r,i)=>{const o={};head.forEach((h,j)=>{o[h]=(r[j]||'').trim();});const m=sch.req.some(c=>!o[c])?'Brak wymaganej wartości':sch.check(o);if(m)bad.push({line:i+2,msg:m});else ok.push(o);});
 return {head,rows,missing,unknown,ok,bad};
}

function buildExport(){
 const E=S.exp,keys=Object.keys(EXP).filter(k=>E.sets[k]);let text,count=0;
 if(E.fmt==='json'){const o={};keys.forEach(k=>{const rows=EXP[k].rows();count+=rows.length;o[k]=rows.map(r=>Object.fromEntries(EXP[k].head.map((h,i)=>[h,r[i]==null?null:r[i]])));});text=JSON.stringify(o,null,2);}
 else{text=keys.map(k=>{const rows=EXP[k].rows();count+=rows.length;return (keys.length>1?'# '+k+'\n':'')+[EXP[k].head,...rows].map(r=>r.map(csvCell).join(',')).join('\n');}).join('\n\n');}

function vPOverview(p){
 const ts=tasksOf(p.id),total=ts.length,cnt=s=>ts.filter(t=>t.status===s).length;
 const done=cnt('done'),doing=cnt('doing'),todo=cnt('todo');
 const high=ts.filter(t=>t.prio>=4).length,over=ts.filter(isOverdue).length,hOver=ts.filter(t=>t.prio>=4&&isOverdue(t)).length;
 const noS=ts.filter(t=>!t.start).length,noD=ts.filter(t=>!t.due).length,miss=ts.filter(t=>!t.start||!t.due).length;
 const compl=total?done/total:0,taskPct=Math.round(compl*100);
 const daily=[];for(let i=13;i>=0;i--){const d=dOff(-i),k=fmt(d);daily.push({label:String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0'),a:ts.filter(t=>t.start===k).length,b:ts.filter(t=>t.due===k).length});}
 const s7=daily.slice(-7).reduce((x,y)=>x+y.a,0),p7=daily.slice(0,7).reduce((x,y)=>x+y.a,0);
 let trend=s7===0&&p7===0?'none':p7===0?'up':(s7-p7)/p7>.1?'up':(s7-p7)/p7<-.1?'down':'stable';
 const mom={up:'Momentum rośnie',down:'Momentum spada',stable:'Momentum stabilne',none:'Za mało danych'}[trend];
 const wd=[0,0,0,0,0,0,0];ts.forEach(t=>{const d=parse(t.start);if(d)wd[d.getDay()]++;});
 const wdItems=[1,2,3,4,5,6,0].map(i=>({l:WD[i],v:wd[i]}));
 let risk=0;if(total){risk=clamp(Math.round((.5*over/total+.3*hOver/total+.2*(noS+noD)/(total*2))*100),0,100);}
 const lvl=risk<35?'healthy':risk<70?'warning':'critical';
 const ps=parse(p.start),pe=parse(p.end);let timePct=0,delta=0,canT=false;
 if(ps&&pe&&pe>ps){canT=true;const tot=Math.max(dBetween(ps,pe),1);const cl=base>pe?pe:base<ps?ps:base;timePct=Math.round(clamp(dBetween(ps,cl),0,tot)/tot*100);delta=taskPct-timePct;}
 let predDays=null,predDate=null;
 if(done>0){let fs=null;ts.filter(t=>t.status==='done').forEach(t=>{const d=parse(t.start);if(d&&(!fs||d<fs))fs=d;});
  if(fs){const vel=done/Math.max(dBetween(fs,base),1),rem=total-done;if(vel>0&&rem>0){predDays=Math.round(rem/vel);predDate=dOff(predDays);}}}
 const cyc=ts.filter(t=>t.start&&t.due).map(t=>dBetween(parse(t.start),parse(t.due))).filter(x=>x>=0);
 const avg=cyc.length?cyc.reduce((a,b)=>a+b,0)/cyc.length:null,sorted=[...cyc].sort((a,b)=>a-b);
 const med=cyc.length?(sorted.length%2?sorted[(sorted.length-1)/2]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2):null,mx=cyc.length?sorted[sorted.length-1]:null;
 const B=[['0–5 d',0,5],['6–10 d',6,10],['11–15 d',11,15],['16–20 d',16,20],['21+ d',21,1e9]];
 const buckets=B.map(([l,a,b])=>({l,v:cyc.filter(x=>x>=a&&x<=b).length}));
 const rk=(f,n,h)=>n>0?`<li><button class="rk" data-act="goto-tasks" data-f="${f}">${h}</button></li>`:`<li>${h}</li>`;
 const stT=todo+doing+done,todoP=stT?Math.round(todo/stT*100):0,doingP=stT?Math.round(doing/stT*100):0,doneP=stT?Math.max(0,100-todoP-doingP):0;
 const m=S.ovF.mode,desc=p.description||'',long=desc.trim().length>160;
 const note={healthy:'W większości pod kontrolą — obserwuj przeterminowane zadania i brakujące daty.',warning:'Są zauważalne problemy — skup się na przeterminowanych i wysokopriorytetowych zadaniach.',critical:'Wysokie ryzyko — projekt wymaga uwagi.'}[lvl];
 const hint=stT===0?'Brak zadań.':doing>todo&&doing>done?'Dużo w toku — zwróć uwagę na blokery.':todo>doing&&todo>done?'Backlog dominuje — rozważ priorytety.':done>todo&&done>doing?'Duża część gotowa — jesteś blisko końca.':'Praca dość równomiernie rozłożona.';
 const recent=[...ts].sort((a,b)=>b.created-a.created).slice(0,4);
 const fd=s=>s?parse(s).toLocaleDateString('pl-PL',{year:'numeric',month:'short',day:'2-digit'}):'—';

 else if(m==='weekly')chart=`<div class="ch-title">Rytm tygodnia</div>${wd.every(x=>!x)?'<div class="empty-s">Brak aktywności.</div>':barChart(wdItems,'Zadania','Liczba zadań według dnia tygodnia','#6366f1')}<div class="ch-foot">Kiedy zwykle zaczyna się praca.</div>${dataTable('Liczba zadań według dnia tygodnia',['Dzień','Zadania'],wdItems.map(i=>[i.l,i.v]))}`;
 else chart=`<div class="ch-title">Skuteczność dostarczania</div>${!cyc.length?'<div class="empty-s">Za mało zadań z uzupełnioną datą startu i terminu.</div>':`<div class="dstats"><div class="dstat"><small>Średnia</small><b>${avg.toFixed(1)} d</b></div><div class="dstat"><small>Mediana</small><b>${med.toFixed(1)} d</b></div><div class="dstat"><small>Maks</small><b>${mx.toFixed(1)} d</b></div></div>${barChart(buckets,'Zadania','Rozkład czasu realizacji zadań','#6366f1')}<div class="ch-foot">Na podstawie zadań z datą startu i terminu.</div>${dataTable('Rozkład czasu realizacji zadań',['Przedział','Zadania'],buckets.map(b=>[b.l,b.v]))}`}`;
 return `<div class="pov">
 <div class="card"><div class="pov-hr"><div><span class="pov-pill ${p.status}">${PS_PL[p.status]}</span><h2 class="pov-title">${esc(p.name)}</h2>${desc?`<p class="pov-desc${S.ovF.desc?'':' col'}">${esc(desc)}</p>${long?`<button class="lnk" data-act="desc-toggle">${S.ovF.desc?'Zwiń':'Pokaż więcej'}</button>`:''}`:''}</div>

  <div class="mood ${lvl}"><span class="dot" style="background:${lvl==='healthy'?'#22c55e':lvl==='warning'?'#eab308':'#ef4444'}"></span><b>${lvl==='healthy'?'Zdrowo':lvl==='warning'?'Uwaga':'Krytycznie'}</b><span>${risk}/100</span></div></div></div>
 <div class="pov-lay"><div class="pov-c pov-main">
  <div class="card sec"><div class="sec-h"><h3>Rozkład pracy</h3><small>Do zrobienia / w trakcie / zrobione</small></div>
  ${stT===0?'<div class="empty-s">Brak zadań — dodaj co najmniej jedno.</div>':`<div class="dist" role="img" aria-label="Do zrobienia ${todoP}%, w trakcie ${doingP}%, zrobione ${doneP}%">${todoP?`<div class="todo" style="width:${todoP}%">Do zrobienia ${todoP}%</div>`:''}${doingP?`<div class="doing" style="width:${doingP}%">W trakcie ${doingP}%</div>`:''}${doneP?`<div class="done" style="width:${doneP}%">Zrobione ${doneP}%</div>`:''}</div>

  <div>${canT?(delta>=5?`<div class="hl">✅ <b>${delta}%</b> do przodu.</div>`:delta<=-5?`<div class="hl">⚠️ <b>${Math.abs(delta)}%</b> za planem.</div>`:'<div class="hl">ℹ️ Mniej więcej zgodnie z planem.</div>'):'<div class="hl">ℹ️ Ustaw start i koniec, aby porównać.</div>'}
  ${predDays!=null?`<div class="hl">📅 Tempo sugeruje koniec za <b>${predDays} dni</b> (${predDate.toLocaleDateString('pl-PL')}).</div>`:''}</div></div>`}</div>
  <div class="card sec"><div class="sec-h"><h3>Przepływ i wydajność</h3><small>Tempo pracy, rytm tygodnia i szybkość dostarczania</small></div>

function vPTimeline(p){

 if(!ts.length)return '<div class="card centered muted">Brak zadań z datami.</div>';

 const dates=ts.flatMap(t=>[t.start,t.due]).concat([p.start,p.end]).filter(Boolean).map(parse);
 const min=new Date(Math.min(...dates)),max=new Date(Math.max(...dates));min.setDate(min.getDate()-3);max.setDate(max.getDate()+3);
 const DW=S.tlZ,n=dBetween(min,max)+1,W=n*DW,X=d=>dBetween(min,d)*DW;
 let ticks='';for(let i=0;i<n;i+=7){const d=new Date(min);d.setDate(d.getDate()+i);ticks+=`<div class="tl-tick" style="left:${i*DW}px">${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}</div>`;}

  const its=ts.filter(t=>g.id==='u'?!t.assg.length:t.assg.includes(g.id)).map(t=>{const s=parse(t.start||t.due),e=parse(t.due||t.start);return{t,s,e};}).sort((a,b)=>a.s-b.s);
  const lanes=[];const placed=its.map(it=>{let l=lanes.findIndex(end=>end<it.s);if(l<0){l=lanes.length;lanes.push(it.e);}else lanes[l]=it.e;return{...it,l};});
  const h=Math.max(1,lanes.length)*32+8;
  return `<div class="tl-row"><div class="tl-lab" style="height:${h}px" title="${esc(g.name)}">${esc(g.name)}</div><div class="tl-trk" style="width:${W}px;height:${h}px">${today}
  ${placed.map(it=>`<div class="tl-bar ${it.t.status} p${it.t.prio}" tabindex="0" aria-label="${esc(it.t.title+', '+ST_PL[it.t.status]+', priorytet '+PR_PL[it.t.prio])}" style="left:${X(it.s)}px;top:${4+it.l*32}px;width:${Math.max((dBetween(it.s,it.e)+1)*DW,DW)}px" data-tip="${esc(it.t.title+'|'+ST_PL[it.t.status]+' • '+PR_PL[it.t.prio]+'|'+(it.t.start||'—')+' → '+(it.t.due||'—'))}">${esc(it.t.title)}</div>`).join('')}</div></div>`;}).join('');
 const lg=(c,l)=>`<span><i style="background:${c}"></i>${l}</span>`;

function vPComments(p){const cms=COMS.filter(c=>c.project===p.id);
 return `<div class="muted">Dyskusja o całym projekcie. Komentarze do zadań są w szczegółach zadań.</div><div class="card">${cmBlock(cms,{project:p.id})}</div>`;}
function vPTime(p){const ts=TASKS.filter(t=>t.project===p.id),ids=new Set(ts.map(t=>t.id)),es=TIME.filter(e=>ids.has(e.task)),tot=es.reduce((a,e)=>a+e.hours,0),est=ts.reduce((a,t)=>a+(t.est||0),0);
 const grp=key=>{const m=new Map();es.forEach(e=>{const k=key(e);m.set(k,(m.get(k)||0)+e.hours);});return [...m.entries()].sort((a,b)=>b[1]-a[1]);};
 const byU=grp(e=>e.user),byT=grp(e=>e.task),byF=grp(e=>{const t=TASKS.find(x=>x.id===e.task);return t&&t.funding?fName(t.funding):'Bez finansowania';});
 const bar=(l,h)=>`<div class="prog"><div class="prog-l"><span>${l}</span><b>${fmtH(h)}</b></div><div class="prog-t"><i style="width:${tot?Math.round(h/tot*100):0}%;background:#6366f1"></i></div></div>`;
 const tile=(h,v,s)=>`<div class="kt-i"><div class="kt-h"><span>${h}</span>${ico('clock')}</div><div class="kt-v">${v}</div><div class="kt-s">${s}</div></div>`;
 return `<div class="muted">Raport czasu: suma wpisów z przypisań osób do zadań projektu.</div>
 <div class="kt" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:10px">${tile('Zarejestrowano',fmtH(tot),es.length+' '+plural(es.length,'wpis','wpisy','wpisów'))}${tile('Szacunek zadań',fmtH(est),est?Math.round(tot/est*100)+'% szacunku':'brak szacunków')}${tile('Osoby',byU.length,'z wpisami czasu')}</div>
 ${es.length?`<div class="cards3"><div class="card"><h2 class="sh">Według osób</h2>${byU.map(([u,h])=>bar(esc(actorName(u)),h)).join('')}</div>
 <div class="card"><h2 class="sh">Według finansowania</h2>${byF.map(([f,h])=>bar(esc(f),h)).join('')}</div>
 <div class="card"><h2 class="sh">Według zadań</h2>${byT.slice(0,8).map(([tid,h])=>{const t=TASKS.find(x=>x.id===tid);return bar(t?`<button class="tlink" data-act="task-open" data-id="${t.id}">${esc(t.title)}</button>`:'—',h);}).join('')}</div></div>`:emptyState('Brak wpisów czasu','Czas rejestrują osoby przypisane do zadań projektu.','')}`;}

 const sk=(h,w='100%',m=0)=>`<div class="sk" style="height:${h}px;width:${w};margin-bottom:${m}px"></div>`;

 if(k==='dash')return `${live}${sk(40,'50%',16)}<div class="dash-grid"><div class="sk-card wide">${sk(110)}</div><div class="sk-card">${sk(120)}</div><div class="sk-card">${sk(120)}</div><div class="sk-card wide">${sk(150)}</div></div>`;
 if(k==='admin')return `${live}${sk(36,'40%',20)}<div class="kt">${sk(100,'100%',0).repeat(4)}</div>${sk(42,'100%',16)}${sk(300)}`;
 return `${live}${sk(90,'100%',12)}<div class="pov-lay"><div class="pov-c pov-main">${sk(220)}${sk(240)}</div><div class="pov-c pov-side">${sk(200)}${sk(200)}</div></div>`;
}
function VS(){const r=S.route;if(r==='login')return vLogin();
 const k=r==='overview'?'dash':r.startsWith('admin')?'admin':r.startsWith('project-')?'detail':'list';

 'project-overview':()=>shell(projectShell('overview',vPOverview)),'project-fundings':()=>shell(projectShell('fundings',vPFund)),'project-tasks':()=>shell(projectShell('tasks',vPTasks)),

let hadModal=false,LT=null,loadTok=0;
const SEEN=new Set();
function render(){
 const a=document.activeElement,id=a&&a.id,ss=a&&a.selectionStart,se=a&&a.selectionEnd;
 const tdS=$('.td-scroll'),tdY=tdS?tdS.scrollTop:0;
 $('#app').innerHTML=(S.loading?VS():V[S.route]())+vTD()+vBell()+vModal();
 {const n=$('.td-scroll');if(n)n.scrollTop=tdY;}
 if(S.modal&&!hadModal){const f=$('.modal input,.modal select,.modal textarea,.modal .btn-danger,.modal .btn');if(f)f.focus();}
 else if(!S.modal&&hadModal){const n=LT&&document.querySelector('[data-act="'+LT.act+'"]'+(LT.id!=null?'[data-id="'+LT.id+'"]':''));if(n)n.focus();}
 else if(id){const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(ss,se);}catch(_){}}}
 hadModal=!!S.modal;
 document.querySelectorAll('.nav.on').forEach(n=>n.setAttribute('aria-current','page'));
 const tl=$('.tl[data-today]');if(tl)tl.scrollLeft=Math.max(0,+tl.dataset.today+170-tl.clientWidth/2);
 if(S.focusSel){const n=$(S.focusSel);if(n)n.focus();S.focusSel=null;}
 document.querySelectorAll('[data-indet="1"]').forEach(e=>{e.indeterminate=true;});
 document.title=S.brand.name;
}
function go(name){
 const n=ROUTES.includes(name)?name:'overview';S.route=n;S.menu=false;S.modal=null;S.kanF.menu=null;S.taskOpen=null;S.bell=false;S.orgOpen=false;
 try{location.hash=n;}catch(_){}window.scrollTo(0,0);
 const tok=++loadTok;
 if(n!=='login'&&!SEEN.has(n)){SEEN.add(n);S.loading=true;render();setTimeout(()=>{if(tok===loadTok){S.loading=false;render();}},380);}
 else{S.loading=false;render();}
}
function toast(msg,o={}){const t=document.createElement('div');t.className='toast';const s=document.createElement('span');s.textContent=msg;t.appendChild(s);
 if(o.fn){const b=document.createElement('button');b.type='button';b.textContent=o.label||'Cofnij';b.onclick=()=>{o.fn();t.remove();};t.appendChild(b);}
 $('#toasts').appendChild(t);setTimeout(()=>t.remove(),o.ms||2600);}

document.addEventListener('click',e=>{
 const a=e.target.closest('a[href^="#"]');
 if(a){e.preventDefault();go(a.getAttribute('href').slice(1));return;}
 if(S.menu&&!e.target.closest('.hb-acc')){S.menu=false;render();}
 if(S.kanF.menu!=null&&!e.target.closest('.kmenu,.kmv')){S.kanF.menu=null;render();}
 const el=e.target.closest('[data-act],[data-set]');if(!el)return;
 if(el.dataset.act&&!el.dataset.act.startsWith('modal-'))LT={act:el.dataset.act,id:el.dataset.id};
 if(el.dataset.set){const v=el.dataset.val;setPath(el.dataset.set,v==='true'?true:v==='false'?false:v);render();return;}
 const fn=ACT[el.dataset.act]||ACT_ADM[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
  if(S.modal){S.modal=null;render();return;}
  if(S.kanF.menu!=null){S.focusSel='[data-act="kan-menu"][data-id="'+S.kanF.menu+'"]';S.kanF.menu=null;render();return;}
  if(S.menu){S.menu=false;render();return;}
 }
 if(e.key==='Tab'&&S.modal){
  const f=[...document.querySelectorAll('.modal button:not([disabled]),.modal input,.modal select,.modal textarea')];
  if(f.length){const first=f[0],last=f[f.length-1],m=$('.modal');
   if(!m.contains(document.activeElement)){e.preventDefault();first.focus();}
   else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
   else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
  return;
 }
 if(e.key==='/'&&!S.modal&&!(e.target.closest&&e.target.closest('input,textarea,select'))){const s=$('[data-search]');if(s){e.preventDefault();s.focus();s.select();}return;}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click();}
});
function onBind(e){const el=e.target.closest('[data-bind]');if(!el)return;setPath(el.dataset.bind,el.type==='checkbox'?el.checked:el.value);render();}
document.addEventListener('input',e=>{if(e.target.matches('input[type="text"],input:not([type]),input[type="number"],textarea'))onBind(e);});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='logo'&&t.files&&t.files[0]){readLogo(t.files[0]);return;}
 if(t.id==='impfile'&&t.files&&t.files[0]){readImp(t.files[0]);return;}
 if(t.matches('select,input[type="checkbox"],input[type="color"]'))onBind(e);
});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.drop'))e.preventDefault();});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('.drop');if(!d)return;e.preventDefault();const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)readImp(f);});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target;
 if(f.id==='loginForm'){logA('login','system','Logowanie do aplikacji');go('overview');toast('Zalogowano!');return;}
 if(f.id==='modalForm'){const m=S.modal,v={};m.fields.forEach(x=>{const el2=f.elements['f-'+x.id];v[x.id]=x.type==='file'?(el2.files&&el2.files[0])||null:el2.value;});S.modal=null;m.onSubmit(v);render();}
});
addEventListener('hashchange',()=>{const n=location.hash.slice(1);if(n&&n!==S.route&&ROUTES.includes(n)){S.route=n;S.menu=false;S.loading=false;SEEN.add(n);++loadTok;render();}});

document.addEventListener('dragend',e=>{const c=e.target.closest('[data-card]');if(c)c.classList.remove('drag');document.querySelectorAll('.kcol-b.over').forEach(x=>x.classList.remove('over'));});

const tip=$('#tip');
function showTip(el,cx,cy){
 tip.innerHTML=el.dataset.tip.split('|').map((l,i)=>i?esc(l):'<b>'+esc(l)+'</b>').join('<br>');tip.style.display='block';
 const w=tip.offsetWidth,h=tip.offsetHeight;let x=cx+14,y=cy+14;if(x+w>innerWidth-8)x=cx-w-14;if(y+h>innerHeight-8)y=cy-h-14;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px';}
document.addEventListener('mousemove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');
 if(!el){tip.style.display='none';return;}
 showTip(el,e.clientX,e.clientY);});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip][tabindex]');if(!el)return;const r=el.getBoundingClientRect();showTip(el,r.left,r.bottom-8);});
document.addEventListener('focusout',()=>{tip.style.display='none';});
document.addEventListener('scroll',()=>{tip.style.display='none';},true);

 if(f.id==='orgForm'){const name=$('#o-name').value.trim(),nip=$('#o-nip').value.replace(/\D/g,''),pr=[0,1,2,3,4].map(i=>$('#o-p'+i).value.trim());
