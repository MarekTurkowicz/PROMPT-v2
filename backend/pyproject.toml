[project]
name = "promt-backend"
version = "2.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==6.1.3",
    "django-cors-headers==4.9.0",
    "django-extensions==4.1",
    "django-stubs-ext==6.1.2",
    "djangorestframework==3.18.3",
    "psycopg2-binary==2.9.13",
    "pymongo==4.20.1",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "django-stubs==6.1.2",
    "djangorestframework-stubs==3.18.2",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "types-psycopg2==2.9.21.20261122",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["migrations"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "DJ"]
# nullable varchar columns are intentional in docs/schemat/promt-schemat.sql
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["api", "core"]
