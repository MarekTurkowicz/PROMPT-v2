[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "DJ"]
# nullable varchar columns are intentional in docs/schemat/promt-schemat.sql
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["api", "core"]
