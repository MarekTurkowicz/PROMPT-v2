[project]
name = "promt-backend"
version = "2.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==5.2.18",
    "Faker==25.8.0",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "PyJWT==2.15.1",
    "annotated-types==0.8.0",
    "asgiref==3.9.1",
    "django-cors-headers==4.8.0",
    "django-extensions==4.1",
    "django-filter==25.2",
    "django-stubs-ext==5.2.9",
    "djangorestframework==3.18.3",
    "djangorestframework-simplejwt==5.5.1",
    "graphviz==0.21",
    "psycopg2-binary==2.9.13",
    "pydantic==2.14.1",
    "pydantic-core==2.50.1",
    "pydot==4.0.1",
    "pyparsing==3.3.1",
    "python-dotenv==1.2.4",
    "sqlparse==0.6.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "tzdata==2025.2",
]

[dependency-groups]
dev = [
    "djangorestframework-stubs==3.16.9",
    "django-stubs==5.2.9",
    "allure-pytest==2.15.3",
    "allure-python-commons==2.15.3",
    "attrs==25.4.0",
    "colorama==0.4.6",
    "coverage==7.13.1",
    "execnet==2.1.2",
    "iniconfig==2.3.0",
    "librt==0.16.0",
    "mypy==1.19.1",
    "mypy-extensions==1.1.0",
    "packaging==25.0",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "pygments==2.20.0",
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
    "pytest-django==4.11.1",
    "pytest-html==4.1.1",
    "pytest-metadata==3.1.1",
    "pytest-sugar==1.1.1",
    "pytest-xdist==3.8.0",
    "termcolor==3.3.0",
    "types-PyYAML==6.0.12.20260906",
    "types-django-filter==25.2.0.20260508",
    "types-psycopg2==2.9.21.20261030",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["migrations"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "DJ"]
# nullable varchar columns are intentional in docs/schemat/promt-schemat.sql
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["api", "core"]
